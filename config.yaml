# Multi-Model RAG Configuration

# Models to use in parallel
models:
  - name: "gpt-3.5-turbo"
    provider: "openai"
    temperature: 0.7
    max_tokens: 500
    enabled: true
  
  - name: "gpt-4"
    provider: "openai"
    temperature: 0.5
    max_tokens: 500
    enabled: false  # Enable if you have access
  
  - name: "text-davinci-003"
    provider: "openai"
    temperature: 0.7
    max_tokens: 500
    enabled: false

# Vector store configuration
vector_store:
  type: "chroma"  # Options: chroma, faiss
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 1000
  chunk_overlap: 200
  collection_name: "multirag_collection"

# Retrieval configuration
retrieval:
  top_k: 5  # Number of documents to retrieve
  score_threshold: 0.5

# Aggregation strategy for multiple model responses
aggregation:
  strategy: "weighted_voting"  # Options: weighted_voting, majority_vote, best_score, all_responses
  weights:
    gpt-3.5-turbo: 1.0
    gpt-4: 1.5
    text-davinci-003: 1.0
